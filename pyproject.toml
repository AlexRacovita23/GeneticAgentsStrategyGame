[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-civilizations"
version = "0.1.0"
description = "Genetic Algorithm Strategy Game"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
visual = [
    "pygame-ce",
]
all = [
    "pytest",
    "pygame-ce",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
