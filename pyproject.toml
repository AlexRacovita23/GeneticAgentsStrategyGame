[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-civilizations"
version = "0.1.0"
description = "Genetic Algorithm Strategy Game"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
visual = [
    "pygame>=2.1.0",
]
all = [
    "pytest>=7.0.0",
    "pygame>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
